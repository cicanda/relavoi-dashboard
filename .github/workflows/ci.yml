name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        # NEXT_PUBLIC_API_URL is baked at build time. For previews/CI we use a
        # placeholder; the production deploy overrides this via the Vercel
        # environment-variable config.
        env:
          NEXT_PUBLIC_API_URL: https://api.relavoi.com/v1
        run: npm run build
