name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        # No continue-on-error anywhere in this file. Errors fail the build;
        # warnings are reported and do not. See eslint.config.mjs.
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: SDK versions match the published tags
        # The guard existed and nothing ran it, so sdk-releases.ts drifted a
        # release behind and every install snippet on the SDK & Docs screen
        # pointed at v0.3.0 while v0.3.1 was out. It reads public tag lists
        # only, needs no credential, and reports a skip rather than a failure
        # when GitHub rate limits it or the runner has no egress.
        run: npm run check:sdk-versions

      - name: Design tokens
        # Fails on a colour or a font that is not a brand token, and on a
        # Tailwind colour utility whose family is not declared in the token
        # file. The brand pass missed two literals and about 110 utility
        # classes; both classes of miss were found by eye, which does not
        # scale. See the header of the script.
        run: npm run check:tokens
      - name: Build
        # NEXT_PUBLIC_API_URL is baked at build time. For previews/CI we use a
        # placeholder; the production deploy overrides this via the Vercel
        # environment-variable config.
        env:
          NEXT_PUBLIC_API_URL: https://api.relavoi.com/v1
        run: npm run build
